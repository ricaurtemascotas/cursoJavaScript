<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inicio</title>

    <style>
      * {
        box-sizing: border-box;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Ubuntu,
          sans-serif;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        margin: 0;
        padding: 16px;
        min-height: 100vh;

        display: flex;
        flex-direction: column;
        justify-content: center;

        background: linear-gradient(180deg, #e6e6ea, #dcdce1);
        color: #1f1f23;
      }

      .links {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }

      a {
        text-decoration: none;
        color: inherit;
      }

      .item {
        height: 68px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        background: linear-gradient(180deg, #ffffff, #e4e4e8);
        border-radius: 14px;
        border: 1px solid #d0d0d6;
        box-shadow: 0 3px 6px rgba(0, 0, 0, 0.08);
        transition: transform 0.1s ease;
      }

      .item:active {
        transform: scale(0.96);
      }

      .item-content {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .label {
        font-size: 0.9rem;
        font-weight: 500;
      }

      .icon {
        width: 20px;
        height: 20px;
        border-radius: 4px;
      }

      /* Buscadores */
      .search-section {
        margin-top: 24px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        max-width: 200px;
        width: 100%;
        margin: 20px auto 0;
      }

      .search-form {
        position: relative;
      }

      .search-icon {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        width: 18px;
        height: 18px;
      }

      .search-form input {
        width: 100%;
        height: 54px;
        border-radius: 14px;
        border: 1px solid #d0d0d6;
        padding-left: 44px;
        font-size: 15px;
        background: linear-gradient(180deg, #ffffff, #e6e6ea);
        box-shadow: 0 3px 6px rgba(0, 0, 0, 0.08);
        outline: none;
      }

      .search-form input:focus {
        border-color: #999;
      }
    </style>
  </head>

  <body>
    <div class="links">
      <a href="https://gemini.google.com/">
        <div class="item">
          <div class="item-content">
            <img class="icon" src="Img/gemini.webp" loading="lazy" />
            <div class="label">Gemini</div>
          </div>
        </div>
      </a>
      <a href="https://drive.google.com/">
        <div class="item">
          <div class="item-content">
            <img class="icon" src="Img/google-drive.webp" loading="lazy" />
            <div class="label">Drive</div>
          </div>
        </div></a
      >

      <a href="https://m.youtube.com/">
        <div class="item">
          <div class="item-content">
            <img class="icon" src="Img/youtube.webp" loading="lazy" />
            <div class="label">YouTube</div>
          </div>
        </div></a
      >
      <a href="https://m.filmaffinity.com/es/main.php">
        <div class="item">
          <div class="item-content">
            <img class="icon" src="Img/filmaffinity.webp" loading="lazy" />
            <div class="label">Filmaffinity</div>
          </div>
        </div></a
      >
      <a href="https://www.rtve.es/noticias/">
        <div class="item">
          <div class="item-content">
            <img class="icon" src="Img/periodico.webp" loading="lazy" />
            <div class="label">Noticias</div>
          </div>
        </div></a
      >

      <a href="https://x.com/">
        <div class="item">
          <div class="item-content">
            <img class="icon" src="Img/x.webp" loading="lazy" />
            <div class="label">X</div>
          </div>
        </div>
      </a>
    </div>

    <div class="search-section">
      <form
        action="https://www.google.com/search"
        method="get"
        class="search-form"
      >
        <img src="Img/google.webp" class="search-icon" />
        <input type="search" name="q" placeholder="Buscar en Google" />
      </form>
    </div>
  </body>
</html>
